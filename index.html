<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Foto AI</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 25px;
            text-align: center;
        }
        .result-box img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .loading {
            display: none;
            color: #007bff;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit Foto AI</h2>
    
    <div class="form-group">
        <label for="apiKey">API Key Clipdrop:</label>
        <input type="text" id="apiKey" placeholder="Masukkan API Key Clipdrop Anda">
    </div>

    <div class="form-group">
        <label for="actionSelect">Pilih Fitur Editan:</label>
        <select id="actionSelect">
            <option value="remove-background">1. Hapus Background (Transparan)</option>
            <option value="image-upscaling">2. Unblur / Tingkatkan Kualitas Foto</option>
            <option value="cleanup">3. Hapus Objek/Orang Lain (Inpainting)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="imageInput">Pilih Foto Utama:</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="form-group" id="maskGroup" style="display: none;">
        <label for="maskInput">Pilih Gambar Mask (Area hitam & putih bagian orang yang ingin dihapus):</label>
        <input type="file" id="maskInput" accept="image/*">
    </div>

    <button onclick="processImage()">Proses Foto</button>

    <div class="loading" id="loadingText">Sedang memproses foto dengan AI, harap tunggu...</div>

    <div class="result-box">
        <h3>Hasil Foto:</h3>
        <div id="resultContainer">Belum ada hasil.</div>
    </div>
</div>

<script>
    // Menampilkan input tambahan jika memilih opsi Hapus Objek (Cleanup)
    document.getElementById('actionSelect').addEventListener('change', function() {
        const maskGroup = document.getElementById('maskGroup');
        if (this.value === 'cleanup') {
            maskGroup.style.display = 'block';
        } else {
            maskGroup.style.display = 'none';
        }
    });

    async function processImage() {
        const apiKey = document.getElementById('apiKey').value;
        const action = document.getElementById('actionSelect').value;
        const imageFile = document.getElementById('imageInput').files[0];
        const maskFile = document.getElementById('maskInput').files[0];
        const loadingText = document.getElementById('loadingText');
        const resultContainer = document.getElementById('resultContainer');

        if (!apiKey) {
            alert('Harap masukkan API Key!');
            return;
        }
        if (!imageFile) {
            alert('Harap pilih foto terlebih dahulu!');
            return;
        }
        if (action === 'cleanup' && !maskFile) {
            alert('Untuk menghapus orang, Anda harus mengunggah gambar mask area orang tersebut!');
            return;
        }

        loadingText.style.display = 'block';
        resultContainer.innerHTML = '';

        const formData = new FormData();
        formData.append('image_file', imageFile);
        if (action === 'cleanup') {
            formData.append('mask_file', maskFile);
        }

        try {
            const response = await fetch(`https://clipdrop-api.co/${action}/v1`, {
                method: 'POST',
                headers: {
                    'x-api-key': apiKey
                },
                body: formData
            });

            if (!response.ok) {
                throw new Error('Gagal memproses gambar. Periksa API Key atau kuota Anda.');
            }

            const blob = await response.blob();
            const imageUrl = URL.createObjectURL(blob);
            
            resultContainer.innerHTML = `<img src="${imageUrl}" alt="Hasil Foto"><br><br>
            <a href="${imageUrl}" download="hasil-foto.png"><button style="width:auto; padding: 8px 16px;">Download Gambar</button></a>`;
        } catch (error) {
            alert(error.message);
        } finally {
            loadingText.style.display = 'none';
        }
    }
</script>

</body>
</html>
